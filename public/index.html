<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sharing Time — Prayer Requests</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<div class="app" id="app">
  <div id="content">Loading…</div>
</div>

<script>
let state = { people: [], requests: [] };
let mode = 'manage'; // 'manage' | 'display'
let editingId = null; // id of the request currently open for editing, if any
let editingPersonId = null; // id of the person currently being renamed, if any
let showPeopleManager = false;
let pollTimer = null;
let statusMsg = '';

function uid(prefix) {
  return prefix + '_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function formatDate(iso) {
  const d = new Date(iso);
  const now = new Date();
  const opts = d.getFullYear() === now.getFullYear()
    ? { month: 'short', day: 'numeric' }
    : { month: 'short', day: 'numeric', year: 'numeric' };
  return d.toLocaleDateString(undefined, opts);
}

function toDateInputValue(iso) {
  const d = new Date(iso);
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${yyyy}-${mm}-${dd}`;
}

function fromDateInputValue(value) {
  // noon avoids the date shifting a day due to timezone conversion
  return new Date(value + 'T12:00:00').toISOString();
}

function findOrCreatePerson(name) {
  const trimmed = name.trim();
  const existing = state.people.find(p => p.name.toLowerCase() === trimmed.toLowerCase());
  if (existing) return existing.id;
  const person = { id: uid('person'), name: trimmed };
  state.people.push(person);
  return person.id;
}

function personName(personId) {
  const p = state.people.find(p => p.id === personId);
  return p ? p.name : 'Unknown';
}

async function loadState() {
  try {
    const res = await fetch('/api/data');
    if (res.ok) {
      const parsed = await res.json();
      state = { people: parsed.people || [], requests: parsed.requests || [] };
      // migrate older single-person requests to the personIds array format, just in case
      state.requests.forEach(r => {
        if (!r.personIds) r.personIds = r.personId ? [r.personId] : [];
        delete r.personId;
      });
    }
  } catch (e) {
    statusMsg = 'Could not reach the server — try refreshing the page.';
  }
  render();
}

async function saveState() {
  try {
    const res = await fetch('/api/data', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(state)
    });
    if (!res.ok) throw new Error('save failed');
  } catch (e) {
    statusMsg = 'Could not save — changes may not persist.';
    render();
  }
}

function addRequestsBatch(entries) {
  const now = new Date();
  entries.forEach((entry, i) => {
    state.requests.unshift({
      id: uid('req'),
      personIds: entry.personIds,
      request: entry.text.trim(),
      urgent: !!entry.urgent,
      // stagger timestamps by 1ms (earlier for later items) so, under newest-first
      // sorting, requests typed together still display in the order they were typed
      dateAdded: new Date(now.getTime() - i).toISOString(),
      answered: false
    });
  });
  saveState();
  render();
}

function startRename(personId) {
  editingPersonId = personId;
  statusMsg = '';
  render();
  const input = document.getElementById('rename-input-' + personId);
  if (input) { input.focus(); input.select(); }
}

function cancelRename() {
  editingPersonId = null;
  render();
}

function saveRename(personId) {
  const input = document.getElementById('rename-input-' + personId);
  const name = input.value.trim();
  if (!name) {
    statusMsg = 'Name can\u2019t be empty.';
    render();
    return;
  }
  const person = state.people.find(p => p.id === personId);
  if (person) person.name = name;
  editingPersonId = null;
  statusMsg = '';
  saveState();
  render();
}

function removePerson(personId) {
  const person = state.people.find(p => p.id === personId);
  if (!person) return;
  const involvedCount = state.requests.filter(r => (r.personIds || []).includes(personId)).length;
  const warning = involvedCount > 0
    ? `Remove ${person.name}? They're on ${involvedCount} prayer request${involvedCount === 1 ? '' : 's'}. Requests only for them will be deleted; requests shared with others will just no longer include them.`
    : `Remove ${person.name}?`;
  if (!confirm(warning)) return;

  state.requests = state.requests
    .map(r => ({ ...r, personIds: (r.personIds || []).filter(pid => pid !== personId) }))
    .filter(r => r.personIds.length > 0);
  state.people = state.people.filter(p => p.id !== personId);
  saveState();
  render();
}

function startEdit(id) {
  editingId = id;
  statusMsg = '';
  render();
}

function cancelEdit() {
  editingId = null;
  render();
}

function saveEdit(id) {
  const entry = state.requests.find(r => r.id === id);
  if (!entry) return;
  const textEl = document.getElementById('edit-text-' + id);
  const peopleContainer = document.getElementById('edit-people-' + id);
  const urgentEl = document.getElementById('edit-urgent-' + id);
  const dateEl = document.getElementById('edit-date-' + id);
  const text = textEl.value.trim();
  const personIds = Array.from(peopleContainer.querySelectorAll('input[type="checkbox"]:checked')).map(cb => cb.value);

  if (!text || personIds.length === 0) {
    statusMsg = 'Please keep some request text and at least one person checked.';
    render();
    return;
  }

  entry.request = text;
  entry.personIds = personIds;
  entry.urgent = !!(urgentEl && urgentEl.checked);
  if (dateEl && dateEl.value) {
    const newIso = fromDateInputValue(dateEl.value);
    if (entry.answered) entry.dateAnswered = newIso;
    else entry.dateAdded = newIso;
  }
  editingId = null;
  statusMsg = '';
  saveState();
  render();
}

function markAnswered(id) {
  const entry = state.requests.find(r => r.id === id);
  if (!entry) return;
  entry.answered = true;
  entry.dateAnswered = new Date().toISOString();
  saveState();
  render();
}

function undoAnswered(id) {
  const entry = state.requests.find(r => r.id === id);
  if (!entry) return;
  entry.answered = false;
  delete entry.dateAnswered;
  saveState();
  render();
}

function deleteEntry(id) {
  state.requests = state.requests.filter(r => r.id !== id);
  saveState();
  render();
}

function setMode(next) {
  mode = next;
  if (next === 'display') editingId = null;
  render();
  restartPolling();
}

function restartPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    if (mode !== 'display') return; // don't disturb an in-progress form in manage mode
    try {
      const res = await fetch('/api/data');
      if (res.ok) {
        const parsed = await res.json();
        state = { people: parsed.people || [], requests: parsed.requests || [] };
        render();
      }
    } catch (e) { /* ignore */ }
  }, 4000);
}

// Group a list of request entries by person, sorted so groups with an urgent
// request come first, then the most recently active person, and requests
// within a group show urgent-first, then newest first.
// A request shared by multiple people appears once under each of them.
function groupByPerson(list) {
  const byPerson = {};
  list.forEach(r => {
    (r.personIds || []).forEach(pid => {
      if (!byPerson[pid]) byPerson[pid] = [];
      byPerson[pid].push(r);
    });
  });
  const groups = Object.keys(byPerson).map(personId => {
    const entries = byPerson[personId].sort((a, b) => {
      if (!!b.urgent !== !!a.urgent) return (b.urgent ? 1 : 0) - (a.urgent ? 1 : 0);
      return new Date(b.dateAdded) - new Date(a.dateAdded);
    });
    const hasUrgent = entries.some(e => e.urgent);
    return { personId, name: personName(personId), entries, hasUrgent, mostRecent: new Date(entries[0].dateAdded) };
  });
  groups.sort((a, b) => {
    if (b.hasUrgent !== a.hasUrgent) return (b.hasUrgent ? 1 : 0) - (a.hasUrgent ? 1 : 0);
    return b.mostRecent - a.mostRecent;
  });
  return groups;
}

function requestLineHtml(entry, isDisplay, currentPersonId) {
  if (!isDisplay && editingId === entry.id) {
    return editFormHtml(entry);
  }
  const isAnswered = entry.answered;
  const dateLabel = formatDate(isAnswered ? entry.dateAnswered : entry.dateAdded);
  const others = (entry.personIds || []).filter(pid => pid !== currentPersonId).map(personName);
  const sharedNote = others.length ? `<div class="shared-with">Shared with ${escapeHtml(others.join(', '))}</div>` : '';
  const urgentBadge = entry.urgent ? `<span class="urgent-badge">Urgent</span>` : '';
  const actions = isDisplay ? '' : `
    <div class="request-actions">
      <button class="edit-btn" onclick="startEdit('${entry.id}')">Edit</button>
      ${isAnswered
        ? `<button class="undo-btn" onclick="undoAnswered('${entry.id}')">Move back</button>`
        : `<button class="answer-btn" onclick="markAnswered('${entry.id}')">Mark answered</button>`
      }
      <button class="delete-btn" onclick="deleteEntry('${entry.id}')">Remove</button>
    </div>`;
  return `
    <div class="request-line ${entry.urgent ? 'urgent' : ''}">
      <div class="request-date">${dateLabel}</div>
      <div class="request-text">${escapeHtml(entry.request)}${urgentBadge}${sharedNote}</div>
      ${actions}
    </div>`;
}

function editFormHtml(entry) {
  const dateIso = entry.answered ? entry.dateAnswered : entry.dateAdded;
  const dateLabel = entry.answered ? 'Date answered' : 'Date added';
  return `
    <div class="request-line editing-line">
      <div class="people-picker-label">Who is this for?</div>
      <div class="people-picker-block">
        <input type="text" class="people-search-input" placeholder="Search people…" oninput="filterPeopleList(this)">
        <div class="people-checkboxes list-format" id="edit-people-${entry.id}">${renderPeopleCheckboxesHtml(entry.personIds || [])}</div>
      </div>
      <textarea class="edit-textarea" id="edit-text-${entry.id}" rows="2">${escapeHtml(entry.request)}</textarea>
      <label class="date-edit-row">
        <span>${dateLabel}</span>
        <input type="date" id="edit-date-${entry.id}" value="${toDateInputValue(dateIso)}">
      </label>
      <label class="urgent-checkbox-row">
        <input type="checkbox" id="edit-urgent-${entry.id}" ${entry.urgent ? 'checked' : ''}>
        Mark as urgent
      </label>
      <div class="edit-actions">
        <button class="save-btn" onclick="saveEdit('${entry.id}')">Save changes</button>
        <button class="cancel-btn" onclick="cancelEdit()">Cancel</button>
      </div>
    </div>`;
}

function personGroupHtml(group, isDisplay) {
  const flame = group.entries[0].answered ? '✦' : '🕯';
  return `
    <div class="person-group">
      <div class="person-name"><span class="flame">${flame}</span>${escapeHtml(group.name)}</div>
      ${group.entries.map(e => requestLineHtml(e, isDisplay, group.personId)).join('')}
    </div>`;
}

function listSection(title, list, isDisplay, emptyText) {
  const groups = groupByPerson(list);
  const body = groups.length
    ? groups.map(g => personGroupHtml(g, isDisplay)).join('')
    : `<div class="empty-note">${emptyText}</div>`;
  return `
    <div class="section-title">${title} <span class="section-count">(${list.length})</span></div>
    <div class="section-rule"></div>
    ${body}`;
}

function render() {
  const app = document.getElementById('app');
  app.className = 'app' + (mode === 'display' ? ' display-mode' : '');

  const activeList = state.requests.filter(r => !r.answered);
  const answeredList = state.requests.filter(r => r.answered);
  const isDisplay = mode === 'display';

  const header = `
    <header class="top">
      <div>
        <h1>Sharing Time</h1>
        <div class="subtitle">Prayer requests</div>
      </div>
      <div class="mode-toggle">
        <button class="${isDisplay ? '' : 'active'}" onclick="setMode('manage')">Manage</button>
        <button class="${isDisplay ? 'active' : ''}" onclick="setMode('display')">Display</button>
      </div>
    </header>`;

  if (isDisplay) {
    document.getElementById('content').innerHTML = `
      ${header}
      ${listSection('Requests', activeList, true, 'No requests right now.')}
      ${listSection('Answered', answeredList, true, 'None answered yet.')}
    `;
    return;
  }

  document.getElementById('content').innerHTML = `
    ${header}
    <div class="status-line">${statusMsg}</div>

    <div class="add-form">
      <label>Prayer requests</label>
      <div id="request-lines">
        ${requestInputRowHtml([])}
      </div>
      <button type="button" class="add-request-line" onclick="addRequestField()">+ Add another request</button>
      <br>
      <button class="submit" onclick="handleAdd()">Add to list</button>
    </div>

    <button type="button" class="people-toggle" onclick="togglePeopleManager()">
      ${showPeopleManager ? 'Hide people list' : 'Add, edit, or remove people…'}
    </button>
    ${showPeopleManager ? peopleManagerHtml() : ''}

    ${listSection('Requests', activeList, false, 'Nothing added yet — use the form above.')}
    ${listSection('Answered', answeredList, false, 'Answered prayers will show up here.')}
  `;
}

function togglePeopleManager() {
  showPeopleManager = !showPeopleManager;
  render();
}

function peopleManagerHtml() {
  const sorted = [...state.people].sort((a, b) => a.name.localeCompare(b.name));
  const list = sorted.length
    ? `<div class="people-manager-list">${sorted.map(p => personManageRowHtml(p)).join('')}</div>`
    : `<div class="empty-note">No one's been added yet — add some below.</div>`;
  return `
    <div class="add-people-block">
      <div class="add-people-hint">Add one or more people at once — one name per line:</div>
      <textarea id="bulk-add-people" rows="3" placeholder="Brittany&#10;Evander&#10;Maria"></textarea>
      <button type="button" onclick="bulkAddPeople()">Add people</button>
    </div>
    ${list}`;
}

function bulkAddPeople() {
  const textarea = document.getElementById('bulk-add-people');
  const names = textarea.value.split('\n').map(n => n.trim()).filter(Boolean);
  if (!names.length) {
    statusMsg = 'Type at least one name, one per line.';
    render();
    return;
  }
  names.forEach(n => findOrCreatePerson(n));
  statusMsg = `Added ${names.length} ${names.length === 1 ? 'person' : 'people'}.`;
  saveState();
  render();
}

function personManageRowHtml(p) {
  if (editingPersonId === p.id) {
    return `
      <div class="person-manage-row editing">
        <input type="text" id="rename-input-${p.id}" value="${escapeHtml(p.name)}">
        <div class="person-manage-actions">
          <button class="save-btn" onclick="saveRename('${p.id}')">Save</button>
          <button class="cancel-btn" onclick="cancelRename()">Cancel</button>
        </div>
      </div>`;
  }
  return `
    <div class="person-manage-row">
      <span class="person-manage-name">${escapeHtml(p.name)}</span>
      <div class="person-manage-actions">
        <button class="edit-btn" onclick="startRename('${p.id}')">Rename</button>
        <button class="delete-btn" onclick="removePerson('${p.id}')">Remove</button>
      </div>
    </div>`;
}

// Renders one request input row: a searchable people-picker plus a textarea.
// selectedIds pre-checks those people (used when duplicating context from the previous row).
function renderPeopleCheckboxesHtml(selectedIds) {
  const sorted = [...state.people].sort((a, b) => a.name.localeCompare(b.name));
  if (!sorted.length) {
    return `<div class="empty-note" style="padding:4px 0;">No one added yet — add people below.</div>`;
  }
  return sorted.map(p => `
    <label class="person-check ${selectedIds.includes(p.id) ? 'checked' : ''}" data-name="${escapeHtml(p.name)}">
      <input type="checkbox" value="${p.id}" ${selectedIds.includes(p.id) ? 'checked' : ''} onchange="this.closest('.person-check').classList.toggle('checked', this.checked)">
      ${escapeHtml(p.name)}
    </label>`).join('');
}

function filterPeopleList(input) {
  const block = input.closest('.people-picker-block');
  if (!block) return;
  const term = input.value.trim().toLowerCase();
  block.querySelectorAll('.person-check').forEach(label => {
    const name = (label.dataset.name || '').toLowerCase();
    label.style.display = !term || name.includes(term) ? '' : 'none';
  });
}

function requestInputRowHtml(selectedIds) {
  return `
    <div class="request-input-row">
      <div class="people-picker-label">Who is this for?</div>
      <div class="people-picker-block">
        <input type="text" class="people-search-input" placeholder="Search people…" oninput="filterPeopleList(this)">
        <div class="people-checkboxes list-format">${renderPeopleCheckboxesHtml(selectedIds)}</div>
      </div>
      <textarea class="request-input" rows="2" placeholder="What should we be praying for?"></textarea>
      <label class="urgent-checkbox-row">
        <input type="checkbox" class="urgent-input">
        Mark as urgent
      </label>
    </div>`;
}

function addRequestField() {
  const container = document.getElementById('request-lines');
  const rows = container.querySelectorAll('.request-input-row');
  // Default the new row's people to whatever was checked in the last row,
  // so continuing requests for the same person/people is a single click.
  const lastRow = rows[rows.length - 1];
  const carryIds = lastRow ? getRowCheckedIds(lastRow) : [];
  const wrapper = document.createElement('div');
  wrapper.innerHTML = requestInputRowHtml(carryIds);
  const newRow = wrapper.firstElementChild;
  container.appendChild(newRow);
  newRow.querySelector('textarea').focus();
}

function getRowCheckedIds(row) {
  return Array.from(row.querySelectorAll('.people-checkboxes input[type="checkbox"]:checked')).map(cb => cb.value);
}

function handleAdd() {
  const rows = Array.from(document.querySelectorAll('.request-input-row'));
  const entries = [];
  let missingPeople = false;

  rows.forEach(row => {
    const text = row.querySelector('.request-input').value.trim();
    if (!text) return; // skip blank rows silently
    const personIds = getRowCheckedIds(row);
    if (personIds.length === 0) {
      missingPeople = true;
      return;
    }
    const urgent = row.querySelector('.urgent-input').checked;
    entries.push({ personIds, text, urgent });
  });

  if (missingPeople) {
    statusMsg = 'Please check who each request is for.';
    render();
    return;
  }
  if (entries.length === 0) {
    statusMsg = 'Please enter at least one request and who it\u2019s for.';
    render();
    return;
  }

  statusMsg = '';
  addRequestsBatch(entries);
}

document.addEventListener('keydown', (e) => {
  if (e.target && e.target.classList && e.target.classList.contains('request-input') && e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
    e.preventDefault();
    handleAdd();
  }
});

loadState();
restartPolling();
</script>

</body>
</html>
